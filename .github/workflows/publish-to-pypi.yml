name: Publish Package to PyPI

on:
  release:
    types: [published]

# Default all jobs to minimal access.
permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'ni/niflexlogger-automation-python'
    runs-on: ubuntu-latest

    steps:
      # For maximum supply-chain protection, replace version tags with
      # reviewed full commit SHAs.
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.9"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    if: github.repository == 'ni/niflexlogger-automation-python'
    needs: build
    runs-on: ubuntu-latest

    steps:
      # This privileged job does not check out or execute repository code.
      - name: Download distributions
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}